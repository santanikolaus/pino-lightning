defaults:
  - objective: physics
  - locus: full
  - stop: fixed
  - _self_
  - experiment: null

exp: base  # ladder rung, set by the experiment yaml; groups runs in wandb
ckpt: ???
target_re: 500
pde_re: null  # Re the adaptation loss assumes; null = target_re (oracle nu).
              # Set a number to adapt under a wrong or inferred viscosity; data
              # selection and every reported metric stay on target_re.
op_re: 100  # operator's training Re, fixed here so the probe's regime is legible from checked-in config, not a live wandb fetch
steps: 10
lr: 3.0e-4
lr_milestones: []  # optimizer steps at which lr halves; [] = constant lr
lr_gamma: 0.5
probe_every: 1
pool_offset: 0  # first train chain in the adapt pool; shift it to re-run a cell on different chains
heldout_split: val  # chains the probe scores. val [240:270] while the ladder is being
                    # selected; test for the one locked read on a frozen config. Never
                    # reaches the gradient path — both splits score the same trajectory.
wandb_project: tta-lr-sweep  # ladder phase, not infrastructure; paths.yaml holds the entity
out_dir: msc/tta/outputs/adapt/${exp}  # relative to setup.ROOT, not the CWD
