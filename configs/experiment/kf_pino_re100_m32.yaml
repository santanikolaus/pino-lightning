# @package _global_
# Mode-capacity control for kf_pino_re100_pretrain (75prctl5): spatial modes 8 -> 32 with
# the temporal budget held at 8. Single-axis change — data, loss weights, width, depth and
# schedule all inherit the same defaults, so any diff against the baseline is capacity.

data:
  data_path: /system/user/studentwork/wehofer/data/ns/NS_fine_Re100_T128_res128_part0.npy

model:
  n_modes: [32, 32, 8]

loss:
  re: 100

trainer:
  check_val_every_n_epoch: 1

logger:
  wandb:
    name: pino-re100-m32
